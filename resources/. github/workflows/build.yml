name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: floscher/connectiq-action@v1
        with:
          manifest-path: manifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: zegarek
          path: bin/*.prg
