name: build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matco/connectiq-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate developer key
        run: |
          openssl genrsa -out developer_key 4096
          openssl pkcs8 -topk8 -nocrypt -in developer_key -out developer_key.der
          ls -l

      - name: Build store IQ
        run: |
          mkdir -p bin
          monkeyc -o bin/Tactical-DJI-Neo-2.iq -f monkey.jungle -y developer_key -e
          ls -l bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tactical-DJI-Neo-2
          path: bin/*.iq
