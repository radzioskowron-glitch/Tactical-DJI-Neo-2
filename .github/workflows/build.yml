name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare folders and key
        run: |
          mkdir -p bin
          openssl genrsa -out developer_key 4096

      - name: Build PRG
        uses: floscher/connectiq-action@v1
        with:
          manifest-path: manifest.xml
          developer-key-path: developer_key

      - name: Upload PRG
        uses: actions/upload-artifact@v4
        with:
          name: zegarek-fenix7pro
          path: bin/*.prg
