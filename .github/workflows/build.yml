name: build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/matco/connectiq-tester:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate developer key
        run: |
          openssl genrsa -out developer_key 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key -out developer_key.der -nocrypt

      - name: Build fenix7
        run: |
          mkdir -p bin
          monkeyc -d fenix7 -f monkey.jungle -o bin/Tactical-DJI-Neo-2.prg -y developer_key.der -w

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tactical-DJI-Neo-2
          path: bin/
