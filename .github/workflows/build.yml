name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matco/connectiq-tester:latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p bin
          openssl genrsa -out developer_key 4096
          monkeyc -o bin/Tactical_DJI_Neo_2.prg -f monkey.jungle -y developer_key -d fenix7pro -w
      - uses: actions/upload-artifact@v4
        with:
          name: zegarek-fenix7pro
          path: bin/
