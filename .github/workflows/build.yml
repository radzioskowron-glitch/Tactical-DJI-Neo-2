name: build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Connect IQ SDK
        uses: matco/setup-connectiq-sdk@v1
        with:
          sdk-version: latest

      - name: Generate developer key
        run: |
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -nocrypt -in developer_key.pem -inform PEM -out developer_key.der -outform DER

      - name: Build store IQ
        run: |
          mkdir -p bin
          monkeyc -o bin/Tactical-DJI-Neo-2.iq -f monkey.jungle -y developer_key.der -e

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tactical-DJI-Neo-2
          path: bin/*.iq
